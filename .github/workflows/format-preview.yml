name: Temporary formatting preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Preview exact Prettier output
        run: |
          npx prettier --write .github/workflows/ci.yml scripts/ui-e2e.mjs src/llm/agent.ts tests/fixtures/fake-acp-model.mjs tests/retry-agent.test.ts
          for file in .github/workflows/ci.yml scripts/ui-e2e.mjs src/llm/agent.ts tests/fixtures/fake-acp-model.mjs tests/retry-agent.test.ts; do
            echo "FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
