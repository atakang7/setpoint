name: Temporary format canonical
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write scripts/ui-e2e.mjs
          echo 'FORMAT_BEGIN:scripts/ui-e2e.mjs'
          base64 -w0 scripts/ui-e2e.mjs
          echo
          echo 'FORMAT_END:scripts/ui-e2e.mjs'
