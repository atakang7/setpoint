name: Format observability once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-observability-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npx prettier --write src/inspect.ts src/ui.ts src/cli.ts tests/inspect.test.ts docs/observability.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inspect.ts src/ui.ts src/cli.ts tests/inspect.test.ts docs/observability.md
          git commit -m "style: format observability [skip ci]"
          git push origin main
